<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תיק פתוח</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
<style>
/* Layout: a case file on a desk. Evidence index on the right, a standing "belief board" on the left that travels with the reader. */
:root{
  --ground:#E3E8EC; --paper:#F8FAFB; --ink:#13232D; --muted:#566872; --line:#C3CDD4;
  --accent:#2440C8; --accent-ink:#FFFFFF; --stamp:#C4372B; --tint:#EDF1F4;
  --hK:#C68A12; --hS:#16857F; --hT:#A63E78; --hM:#4C5BD0; --hO:#AEB9C0;
  --display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --body:"IBM Plex Sans Hebrew","Heebo","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0F171C; --paper:#172229; --ink:#E3EAEE; --muted:#93A4AE; --line:#2C3B45;
  --accent:#8C9EFF; --accent-ink:#0F171C; --stamp:#F0715F; --tint:#1D2A32;
  --hK:#E0A93A; --hS:#3DB5AD; --hT:#D772A8; --hM:#8A97F2; --hO:#44535D; color-scheme:dark } }
:root[data-theme="dark"]{
  --ground:#0F171C; --paper:#172229; --ink:#E3EAEE; --muted:#93A4AE; --line:#2C3B45;
  --accent:#8C9EFF; --accent-ink:#0F171C; --stamp:#F0715F; --tint:#1D2A32;
  --hK:#E0A93A; --hS:#3DB5AD; --hT:#D772A8; --hM:#8A97F2; --hO:#44535D; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
#app{direction:rtl;max-width:1120px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-size:2rem;font-weight:900}
.brand span{color:var(--muted);font-size:.9rem}
.clock{display:flex;align-items:center;gap:10px;font-size:.9rem}
.clock b{font-variant-numeric:tabular-nums}
.ticks{display:flex;gap:3px;direction:ltr}
.ticks i{width:14px;height:20px;border:1.5px solid var(--ink);background:var(--ink)}
.ticks i.used{background:transparent;border-color:var(--line)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
.layout>*{min-width:0}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){ .layout{grid-template-columns:minmax(0,1fr)} aside{position:static} }

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:24px}
@media (max-width:480px){ .sheet{padding:18px 16px} }
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.lede{font-size:1.06rem;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.btn{border:1.5px solid var(--ink);background:transparent;border-radius:3px;padding:10px 16px;font-weight:600}
.btn:hover{background:var(--tint)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}

/* brief */
.mail{position:relative;border:1px solid var(--line);background:var(--tint);padding:18px 20px;border-radius:3px}
.mail dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 14px;font-size:.9rem;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mail dt{color:var(--muted)} .mail dd{margin:0;font-weight:500}
.mail p+p{margin-top:10px}
.stamp{position:absolute;top:14px;left:16px;transform:rotate(-7deg);border:2.5px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-weight:900;padding:1px 10px;font-size:1.05rem;letter-spacing:.08em;opacity:.85}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.facts div{border-top:2px solid var(--ink);padding-top:8px}
.facts b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.facts span{font-size:.85rem;color:var(--muted)}

/* belief board */
.board h2{font-size:1.2rem}
.bar10{display:flex;height:14px;border-radius:2px;overflow:hidden;direction:rtl;background:var(--hO)}
.bar10 i{display:block;transition:flex-grow .25s}
.hyp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hyp .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.hyp .nm i{width:12px;height:12px;border-radius:50%;flex:none}
.hyp .ds{grid-column:1;font-size:.84rem;color:var(--muted);line-height:1.4}
.step{grid-row:1/span 2;grid-column:2;display:flex;align-items:center;gap:6px;direction:ltr}
.step button{width:32px;height:32px;border:1.5px solid var(--ink);background:transparent;border-radius:50%;font-weight:600;line-height:1;padding:0}
.step button:hover:not([disabled]){background:var(--tint)}
.step button[disabled]{opacity:.3;cursor:not-allowed}
.step b{min-width:1.4em;text-align:center;font-size:1.15rem;font-variant-numeric:tabular-nums}
.pool{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:.9rem}

/* evidence index */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-height:132px}
.card:hover:not([disabled]){border-color:var(--ink)}
.card[disabled]{opacity:.5;cursor:not-allowed}
.card.open{background:var(--tint)}
.card .top{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:600}
.tag{padding:1px 8px;border:1.5px solid currentColor}
.tag.t-talk{border-radius:12px} .tag.t-data{border-style:dashed} .tag.t-obs{border-radius:12px 2px}
.card h3{font-size:1.12rem;font-weight:700}
.card p{font-size:.86rem;color:var(--muted);line-height:1.45}
.card .cost{margin-top:auto;font-size:.82rem;font-weight:600}

/* reader */
.reader h2{font-size:1.6rem;font-weight:700}
.talk{display:flex;flex-direction:column;gap:12px}
.talk .q{color:var(--muted);font-size:.95rem;padding-inline-start:14px;border-inline-start:2px solid var(--line)}
.talk .a{background:var(--tint);padding:12px 16px;border-radius:3px 14px 14px 14px;max-width:60ch}
.talk .a b{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.notes{display:flex;flex-direction:column;gap:10px;font-family:var(--display);font-weight:500;font-size:1.05rem}
.notes p{padding:8px 14px;border-inline-start:3px solid var(--line);max-width:64ch}
.notes b{font-family:var(--body);font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--muted);margin-inline-end:8px}
.docp{border:1px solid var(--line);padding:18px 20px;background:var(--tint);display:flex;flex-direction:column;gap:10px}
.docp h3{font-size:1.1rem}
.docp li{margin-bottom:6px}
.docp ol,.docp ul{margin:0;padding-inline-start:20px}
.foot{font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.vbars{display:flex;gap:4px;align-items:flex-end}
.vb{flex:1;min-width:0;text-align:center;font-size:.72rem;font-variant-numeric:tabular-nums}
.vb .plot{height:140px;display:flex;align-items:flex-end;justify-content:center}
.vb .plot i{display:block;width:72%;background:var(--ink);height:calc(var(--v) / 22 * 100%)}
.vb.old .plot i{background:var(--hO)}
.vb span{display:block;color:var(--muted)}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 3.2em;gap:10px;align-items:center;font-size:.92rem;padding:5px 0}
.hb .tr{height:18px;background:var(--tint);border:1px solid var(--line)}
.hb .tr i{display:block;height:100%;background:var(--ink);width:calc(var(--v) / var(--max) * 100%)}
.hb b{font-variant-numeric:tabular-nums}
.hb small{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%}

/* recommend */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.act{text-align:right;border:1.5px solid var(--line);background:var(--paper);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:6px}
.act[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.act h3{font-size:1.08rem}
.act p{font-size:.88rem;color:var(--muted);line-height:1.45}
.act .meta{font-size:.8rem;font-weight:600;margin-top:auto}
input[type=text]{font:inherit;color:inherit;width:100%;padding:10px 12px;background:var(--paper);border:1.5px solid var(--line);border-radius:3px}

/* debrief */
.result{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px}
.result .big{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,8vw,3.8rem);line-height:1;font-variant-numeric:tabular-nums}
.split{display:flex;height:34px;direction:rtl;border-radius:2px;overflow:hidden}
.split i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.8rem;font-weight:600;color:var(--paper);min-width:0}
.trail{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:minmax(0,190px) 1fr;gap:12px;align-items:center;font-size:.86rem}
.trow span{overflow-wrap:anywhere;line-height:1.3}
@media (max-width:520px){ .trow{grid-template-columns:minmax(0,1fr);gap:2px} .arow{grid-template-columns:minmax(0,1fr)} }
.audit{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:4px 14px;padding:11px 0;border-top:1px solid var(--line)}
.arow .st{font-size:.78rem;font-weight:600}
.arow.miss .st{color:var(--stamp)}
.arow h3{font-family:var(--body);font-size:.98rem;font-weight:600}
.arow p{font-size:.9rem;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{font-size:.76rem;font-weight:600;padding:0 8px;border-radius:10px;border:1.5px solid var(--c);color:var(--ink)}
.check{padding:12px 16px;border-inline-start:4px solid var(--line);background:var(--tint)}
.check.ok{border-color:var(--hS)} .check.weak{border-color:var(--hK)} .check.none{border-color:var(--stamp)}
.qs{margin:0;padding-inline-start:22px;max-width:66ch} .qs li{margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h2.sec{font-size:1.35rem;font-weight:700}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div id="app" dir="rtl" lang="he"></div>

{id:'bytype',t:'data',cost:2,title:'פילוח לפי סוג תביעה',tease:'איפה בדיוק חוזרים התיקים?',

function recommend(){
  return '<div class="layout"><main class="stack"><section class="sheet stack"><p class="eyebrow">יום חמישי · ועדת ההיגוי</p><h2 class="sec">מה אתם ממליצים לגלית?</h2>'+
  '<p class="lede">בחרו מהלך אחד או שניים. לכל אחד מהם אפשר למצוא הצדקה, והשאלה היא על מה ההמלצה שלכם נשענת.</p>'+
  '<div class="acts">'+A.map(function(a){var on=S.acts.indexOf(a.id)>=0;
    return '<button class="act" data-act="pick" data-id="'+a.id+'" data-key="a'+a.id+'" aria-pressed="'+on+'"><h3>'+a.n+'</h3><p>'+a.d+'</p><span class="meta">'+a.m+'</span></button>'}).join('')+'</div>'+
  '<label class="stack" style="gap:6px" for="line"><span class="small" style="font-weight:600">המשפט הראשון שתגידו לגלית (לא חובה)</span><input type="text" id="line" maxlength="160" value="'+esc(S.line)+'" placeholder="גלית, לפני שמדברים על הקורס..."></label>'+
  '<div class="row"><button class="btn go" data-act="submit" data-key="submit"'+(S.acts.length?'':' disabled')+'>מגישים לוועדה</button><button class="btn" data-act="toindex" data-key="toindex">חזרה לתיק</button><span class="small muted">'+(S.acts.length?'נבחרו '+S.acts.length+' מתוך 2':'בחרו לפחות מהלך אחד')+'</span></div>'+
  '</section></main><aside>'+board('')+'</aside></div>'}

function calc(){
  var has=function(x){return S.acts.indexOf(x)>=0}, t=0;
  S.acts.forEach(function(a){t+=AV[a].eff});
  if(has('course')&&has('newhires'))t-=1;
  if(has('jobaid')&&has('bonus'))t+=1.5;
  var felt=t-(has('metric')?5:0);
  return {final:Math.round((19-t)*10)/10,felt:Math.round(felt*10)/10,has:has}}

function debrief(){
  var r=calc(), names=S.acts.map(function(a){return AV[a].n});
  var extra='';
  if(r.has('jobaid')&&r.has('bonus'))extra='<p>השילוב עבד טוב יותר מכל מהלך לבדו: כשהמהירות הפסיקה להשתלם, לנציגים היה זמן להשתמש בדף הבדיקה.</p>';
  if(r.has('course')&&r.has('newhires'))extra='<p>שני המהלכים טיפלו באותו חלק קטן של הבעיה, ולכן כמעט לא הצטברו.</p>';
  if(r.has('sysfix')&&r.has('jobaid'))extra='<p>דף הבדיקה גישר על התקופה שעד תיקון המערכת. אחרי פברואר הוא כבר כמעט לא יידרש.</p>';
  // trail analysis
  var big=null,bigv=0,T=S.trail;
  for(var i=1;i<T.length;i++){var d=0;HK.forEach(function(k){d+=Math.abs(T[i].c[k]-T[i-1].c[k])});d+=Math.abs(sum(T[i].c)-sum(T[i-1].c));d/=2;if(d>bigv){bigv=d;big=T[i].label}}
  var first=T[0].c,last=T[T.length-1].c,pool=10-sum(last);
  var tl=big?'הראיה שהזיזה אתכם הכי הרבה: <b>'+big+'</b> ('+bigv+' אסימונים).':'הלוח שלכם לא זז מאז הימור הפתיחה. שווה לשאול אם הראיות באמת לא שינו דבר, או שלא עצרתם לעדכן.';
  if(pool)tl+=' סיימתם עם '+pool+' אסימונים פתוחים. גם זו עמדה מקצועית.';
  if(first.K>=5&&last.K>=5)tl+=' פתחתם עם רוב האסימונים על חוסר ידע, ושם גם סיימתם.';
  S.summary='תיק פתוח · שקד ביטוח\nפתחתי '+S.opened.length+' ראיות מתוך 13 ביום עבודה אחד.\nהמלצתי: '+names.join(' + ')+'.\nשלושה חודשים אחר כך: תיקים חוזרים 19% ← '+r.final+'%.'+(big?'\nהראיה שהזיזה אותי הכי הרבה: '+big+'.':'');

  return '<main class="stack" style="gap:20px">'+
  '<section class="sheet stack"><p class="eyebrow">שלושה חודשים אחר כך</p>'+
  '<div class="result"><span class="big">19% ← '+r.final+'%</span><span class="muted">שיעור התיקים החוזרים המדווח</span></div>'+
  '<p class="lede">מתוך הירידה, <b>'+r.felt+' נקודות</b> הן שיפור שלקוחות מרגישים בפועל.</p>'+
  (S.line?'<p class="muted">פתחתם את הישיבה במשפט: "'+esc(S.line)+'"</p>':'')+
  S.acts.map(function(a){return '<div><h3 style="font-size:1.1rem">'+AV[a].n+'</h3><p style="max-width:66ch">'+AV[a].out+'</p></div>'}).join('')+extra+'</section>'+

  '<section class="sheet stack"><h2 class="sec">על מה ההמלצה נשענה</h2>'+
  S.acts.map(function(a){var hit=AV[a].sup.filter(function(x){return S.opened.indexOf(x)>=0}).map(function(x){return EV[x].title});
    var cls=hit.length>=2?'ok':hit.length?'weak':'none';
    var txt=hit.length>=2?'נשען על ראיות שפתחתם: '+hit.join(', ')+'.':hit.length?'נשען על ראיה אחת שפתחתם: '+hit[0]+'. מספיק כדי להעלות את זה, פחות כדי להתחייב.':'לא פתחתם אף ראיה שתומכת במהלך הזה. ייתכן שהוא נכון, אבל בוועדה זו תהיה הנחה ולא ממצא.';
    return '<div class="check '+cls+'"><b>'+AV[a].n+'</b><p>'+txt+'</p></div>'}).join('')+'</section>'+

  '<section class="sheet stack"><h2 class="sec">ממה הפער היה עשוי</h2>'+
  '<p style="max-width:66ch">לתיק הזה אין הסבר אחד. כך מתפרקות 19 הנקודות בדיעבד:</p>'+
  '<div class="split" role="img" aria-label="פירוק הפער"><i style="flex:6;background:var(--hO);color:var(--ink)">6</i><i style="flex:5;background:var(--hM)">5</i><i style="flex:4;background:var(--hS)">4</i><i style="flex:2.5;background:var(--hT)">2.5</i><i style="flex:1.5;background:var(--hK)">1.5</i></div>'+
  '<div class="legend"><span><i style="background:var(--hO)"></i>היה שם תמיד</span>'+['M','S','T','K'].map(function(k){return '<span><i style="background:'+H[k].c+'"></i>'+H[k].n+'</span>'}).join('')+'</div>'+
  '<p style="max-width:66ch">הקורס שגלית ביקשה מכוון לפרוסה הקטנה ביותר, וגם בה הוא מחטיא: לחדשים חסר שיקול דעת בתיקים אמיתיים, לא היכרות עם כפתורים.</p></section>'+

  '<section class="sheet stack"><h2 class="sec">מסלול החשיבה שלכם</h2><p style="max-width:66ch">'+tl+'</p>'+
  '<div class="trail">'+T.map(function(s){return '<div class="trow"><span>'+s.label+'</span>'+bar10(s.c)+'</div>'}).join('')+'</div>'+
  '<div class="legend">'+HK.map(function(k){return '<span><i style="background:'+H[k].c+'"></i>'+H[k].n+'</span>'}).join('')+'<span><i style="background:var(--hO)"></i>עדיין פתוח</span></div></section>'+

  '<section class="sheet stack"><h2 class="sec">מה היה בתיק</h2><p class="muted small">כל 13 הראיות, כולל אלה שנשארו סגורות. הסימון מראה איזה הסבר כל ראיה מחזקת (▲) או מחלישה (▼).</p><div class="audit">'+
  E.map(function(e){var op=S.opened.indexOf(e.id)>=0;
    return '<div class="arow'+(op?'':' miss')+'"><span class="st">'+(op?'נפתח':'נשאר סגור')+'</span><div><h3>'+e.title+' <span class="muted" style="font-weight:400">· '+TYPES[e.t]+', '+hrs(e.cost)+'</span></h3><p>'+e.read+'</p><div class="pills">'+
    HK.filter(function(k){return e.fx[k]}).map(function(k){return '<span class="pill" style="--c:'+H[k].c+'">'+(e.fx[k]>0?'▲':'▼')+' '+H[k].n+'</span>'}).join('')+'</div></div></div>'}).join('')+'</div></section>'+

  '<section class="sheet stack"><h2 class="sec">לדיון</h2><ol class="qs"><li>אילו התחלתם מחדש, איזו ראיה הייתם פותחים ראשונה, ולמה דווקא אותה?</li><li>גלית כבר אישרה תקציב לקורס. איך אומרים לה שהוא יפתור חלק קטן מהבעיה, בלי שהיא תאבד פנים בוועדה?</li><li>באיזה מצב קורס הרענון היה דווקא ההמלצה הנכונה? אילו ראיות היו צריכות להיראות אחרת?</li></ol>'+
  '<div class="row"><button class="btn go" data-act="restart" data-key="restart">חוקרים שוב, אחרת</button><button class="btn" data-act="copy" data-key="copy">העתקת סיכום לשיתוף</button><span class="small muted" id="copied" aria-live="polite"></span></div>'+
  '<p class="small muted">תרחיש בדוי. החברה, האנשים והנתונים הומצאו לצורכי למידה.</p></section></main>'}

var app=document.getElementById('app');
function render(top){
  var k=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.key:null;
  var v=S.phase==='brief'?brief():S.phase==='index'?index():S.phase==='reader'?reader():S.phase==='recommend'?recommend():debrief();
  app.innerHTML=header()+v;
  if(top){window.scrollTo(0,0)} else if(k){var el=app.querySelector('[data-key="'+k+'"]');if(el&&!el.disabled)el.focus({preventScroll:true})}}

app.addEventListener('input',function(ev){if(ev.target.id==='line')S.line=ev.target.value});
app.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b||b.disabled)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='chip'){var d=+b.dataset.d,h=b.dataset.h; if(d>0&&sum(S.chips)>=10)return; if(d<0&&S.chips[h]<=0)return; S.chips[h]+=d; return render()}
  if(a==='start'){snap('הימור פתיחה');S.phase='index';return render(true)}
  if(a==='open'){var e=EV[id]; if(S.opened.indexOf(id)<0){if(e.cost>S.hours)return;S.hours-=e.cost;S.opened.push(id);S.fresh=true}else S.fresh=false; S.cur=id;S.phase='reader';return render(true)}
  if(a==='back'){if(S.fresh)snap(EV[S.cur].title); else if(!same(S.chips,S.trail[S.trail.length-1].c))snap('קריאה חוזרת: '+EV[S.cur].title); S.phase='index';return render(true)}
  if(a==='torec'){S.phase='recommend';return render(true)}
  if(a==='toindex'){S.phase='index';return render(true)}
  if(a==='pick'){var i=S.acts.indexOf(id); if(i>=0)S.acts.splice(i,1); else {if(S.acts.length>=2)S.acts.shift();S.acts.push(id)} return render()}
  if(a==='submit'){if(!S.acts.length)return; if(!same(S.chips,S.trail[S.trail.length-1].c))snap('לפני ההמלצה'); S.phase='debrief';return render(true)}
  if(a==='restart'){fresh();return render(true)}
  if(a==='copy'){var out=document.getElementById('copied');
    var fb=function(){var ta=document.createElement('textarea');ta.value=S.summary;ta.style.cssText='width:100%;min-height:110px;margin-top:8px;font:inherit';b.parentNode.after(ta);ta.select();out.textContent='סמנו והעתיקו את הטקסט.'};
    try{navigator.clipboard.writeText(S.summary).then(function(){out.textContent='הסיכום הועתק.'},fb)}catch(x){fb()}}
});
render(true);
})();
</script>
</html>
